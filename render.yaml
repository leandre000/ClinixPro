services:
  - type: web
    name: clinixpro-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_SERVLET_CONTEXT_PATH
        value: /api
      - key: JWT_SECRET
        value: 364115689b626958012b9d7feb17d295d8889060cd1806a1a42d155898d52188d1ceada7ed4709073cdd26572bdc
      - key: JWT_EXPIRATION
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000
      - key: APP_NAME
        value: ClinixPro
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_ENVIRONMENT
        value: production
      - key: SPRING_WEB_CORS_ALLOWED_METHODS
        value: GET,POST,PUT,DELETE,OPTIONS,PATCH
      - key: SPRING_WEB_CORS_ALLOWED_HEADERS
        value: "*"
      - key: SPRING_WEB_CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://clinixpro.vercel.app,https://clinixpro.com,http://localhost:3000"
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: clinixpro@hospital.com
      - key: MAIL_PASSWORD
        value: your-app-password
    healthCheckPath: /api/health
    autoDeploy: true
    plan: starter

databases:
  - name: clinixpro-db
    databaseName: clinixpro
    user: clinixpro_user
    plan: starter 